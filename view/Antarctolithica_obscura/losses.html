  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* Skin-supplied page texture (scanlines for the neon skin, `none`
       everywhere else) painted as a background layer on the page ground.
       An element's background always paints below all of its descendants, so
       the texture can never land on a card, a table, the detail panel or a
       tooltip -- it shows in the page's negative space only. An overlay
       element positioned above the content cannot make that guarantee without
       every content region opting out by z-index, which is how the first
       attempt at this put scanlines across the detail panel and the heatmap
       tooltip. Deliberately static, never animated. */
    background: var(--page) var(--overlay);
    color: var(--text-primary);
    font: 14px/1.5 var(--font-ui);
  }
  .wrap { max-width: min(95vw, 2100px); margin: 0 auto; padding: 24px 20px 64px; }
  header.top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
  header.top .titles { flex: 1; min-width: 0; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; text-shadow: var(--glow); }
  .sub { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .mono { font-family: var(--font-mono); font-size: 11px; }
  button, select, input[type="search"] {
    font: inherit;
    color: var(--text-primary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--hover-wash); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--series-1);
    outline-offset: 2px;
  }
  .btn-ghost { background: transparent; }
  section.card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card-title { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .card-note { margin: 0 0 16px; color: var(--text-secondary); font-size: 12px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 28px; }
  .tile-label { color: var(--text-secondary); font-size: 12px; }
  .tile-value { font-size: 20px; font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .filters input[type="search"] { min-width: 260px; }
  .spacer { flex: 1; }
  .count { color: var(--text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
  .explorer { display: grid; grid-template-columns: 1fr 380px; gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .explorer { grid-template-columns: 1fr; } }
  .tbl-scroll { overflow: auto; height: 560px; }
  table.data { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.data th, table.data td {
    text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap;
  }
  table.data th {
    position: sticky; top: 0; background: var(--surface-1); font-weight: 600; z-index: 1;
    border-bottom: 1px solid var(--axis);
  }
  table.data th.sortable { cursor: pointer; user-select: none; }
  table.data th.sortable:hover { color: var(--series-1); }
  table.data th.sortable::after { content: ""; margin-left: 4px; color: var(--series-1); }
  table.data th.sortable.sort-active::after { content: "\25BE"; }
  table.data td.num { font-variant-numeric: tabular-nums; }
  /* Text columns grow with the viewport (floor keeps them readable, ceiling bounded). */
  table.data td.wrap-cell, table.data th.wrap-cell {
    white-space: normal; overflow-wrap: anywhere;
    min-width: 200px; max-width: clamp(260px, 26vw, 640px);
  }
  table.data td.cell, table.data th.cell { padding: 6px 5px; text-align: center; }
  table.data tbody tr:hover { background: var(--hover-wash); }
  table.data tbody tr.sel { background: var(--wash); }
  .empty { padding: 40px 8px; color: var(--text-secondary); font-size: 13px; }
  .detail { position: sticky; top: 16px; }
  .detail h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; word-break: break-all; }
  .detail .species { color: var(--text-secondary); font-size: 12px; font-style: italic; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 3px; }
  .field-value { font-size: 13px; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    display: inline-block; padding: 2px 7px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 11px; text-decoration: none; color: var(--text-primary); background: var(--page);
  }
  .chip:hover { border-color: var(--series-1); }
  a.pfam-link { color: var(--series-1); text-decoration: none; }
  a.pfam-link:hover { text-decoration: underline; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a, .links button {
    font-size: 12px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px;
    text-decoration: none; color: var(--text-primary); background: var(--page);
  }
  .links a:hover, .links button:hover { border-color: var(--series-1); }
  /* The "this protein has no annotation" follow-up cluster -- the population
     this pipeline exists to surface, so it gets its own visible grouping
     rather than being one more link in the row. */
  .links-note {
    font-size: 11px; color: var(--muted); margin: 8px 0 4px;
  }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10.5px;
    border: 1px solid var(--border); color: var(--text-secondary);
  }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .placeholder { color: var(--text-secondary); font-size: 13px; }
  .hidden { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media print {
    .filters, .tabs, header.top select, header.top button { display: none !important; }
    .tbl-scroll { height: auto; overflow: visible; }
    .explorer { grid-template-columns: 1fr; }
  }

  /* .badge / .badge.warn now live in BASE_PAGE_CSS and read var(--warn), so a
     skin owns the colour instead of this page hardcoding a light/dark pair. */
</style>
<script>
(function () {
  try {
    var v = localStorage.getItem("novinvenio.skin");
    if (v && ["paper", "dark", "neuromancer", "contrast"].indexOf(v) >= 0) {
      document.documentElement.setAttribute("data-skin", v);
    }
  } catch (e) { /* opaque file:// origin, or storage disabled */ }
})();

    <button id="f-reset" type="button">Reset</button>
    <div class="spacer"></div>
    <span class="count" id="count" role="status" aria-live="polite"></span>
    <button id="dl-tsv" type="button">Download TSV</button>
  </div>

  <div class="explorer">
    <section class="card" style="padding:14px">
      <div class="tbl-scroll" id="tbl-scroll">
        <table class="data">
          <caption class="sr-only">Candidate gene losses matching the current filters</caption>
          <thead id="tbl-head"></thead>
          <tbody id="tbl-body"></tbody>
        </table>
      </div>
      <p class="empty hidden" id="tbl-empty">No proteins match the current filters.</p>
    </section>

    <aside class="card detail" id="detail" aria-live="polite">
      <p class="placeholder">Select a protein in the table to see its annotation and database links.</p>
    </aside>
  </div>
</div>

        node.href = "https://www.ebi.ac.uk/interpro/entry/pfam/" + acc + "/";
        node.target = "_blank"; node.rel = "noopener noreferrer";
        node.title = acc + (ev ? " — hmmsearch E-value " + ev : "");
      } else {
        node = el("span", "chip", n);
      }
      chips.appendChild(node);
    });
    return chips;
  }
  // Compact comma-separated Pfam links for a table cell (same accession rule as
  // pfamChipsNode, without the chip styling -- a table row is dense already).
  function pfamLinksInline(pfamNames, pfamAccs) {
    var frag = document.createDocumentFragment();
    var names = pfamNames ? pfamNames.split(",") : [];
    var accs = pfamAccs ? pfamAccs.split(",") : [];
    names.forEach(function (n, i) {
      if (i > 0) frag.appendChild(document.createTextNode(", "));
      var acc = (accs[i] || "").split(".")[0];
      if (/^PF\d+$/.test(acc)) {
        var a = el("a", "pfam-link", n);
        a.href = "https://www.ebi.ac.uk/interpro/entry/pfam/" + acc + "/";
        a.target = "_blank"; a.rel = "noopener noreferrer";
        a.title = acc;
        frag.appendChild(a);
      } else {
        frag.appendChild(document.createTextNode(n));
      }
    });
    return frag;
  }

  // ---- genome-database gene records --------------------------------------
  // Driven by the config CSV's optional SourceDB column, carried through to
  // each payload proteome entry as `source_db` (see lib/config_parser.py).
  // Before this, a gene-record link was gated on the annotation source being
  // a ModelOrg_* entry, so only the handful of model organisms got one even
  // though most of the sample pool lives in FungiDB or MycoCosm.
  //
  // Accepted forms: "fungidb", "mycocosm:<portal>", "ensemblfungi:<species>",
  // "veupathdb:<project>", or any URL template containing "{gene}".
  // A config CSV travels between users and projects, so a SourceDB value is
  // only semi-trusted: anything that ends up in an href must be checked for
  // its scheme, or "javascript:...{gene}" becomes a clickable link in the
  // report. The keyed forms below interpolate into a fixed https:// prefix,
  // so only the free-form template needs the check.
  function isSafeHttpUrl(url) {
    return /^https?:\/\//i.test(url);
  }
  function genomeDbLink(sourceDb, proteinId) {
    if (!sourceDb) return null;
    var gene = geneIdFromProteinId(proteinId);
    if (sourceDb.indexOf("{gene}") >= 0) {
      if (!isSafeHttpUrl(sourceDb)) return null;
      return extLink("Gene record", sourceDb.replace("{gene}", encodeURIComponent(gene)),
                     "Source database record for " + gene);
    }
    var sep = sourceDb.indexOf(":");
    var kind = (sep >= 0 ? sourceDb.slice(0, sep) : sourceDb).toLowerCase();
    var arg = sep >= 0 ? sourceDb.slice(sep + 1) : "";
    if (kind === "fungidb") {
      return extLink("FungiDB gene",
        "https://fungidb.org/fungidb/app/record/gene/" + encodeURIComponent(gene),
        "FungiDB gene record for " + gene);
    }
    if (kind === "mycocosm" && arg) {
      return extLink("JGI MycoCosm",
        "https://mycocosm.jgi.doe.gov/cgi-bin/dispGeneModel?db=" +
          encodeURIComponent(arg) + "&id=" + encodeURIComponent(proteinId),
        "JGI MycoCosm gene model in portal " + arg);
    }
    if (kind === "ensemblfungi" && arg) {
      return extLink("Ensembl Fungi",
        "https://fungi.ensembl.org/" + encodeURIComponent(arg) +
          "/Gene/Summary?g=" + encodeURIComponent(gene),
        "Ensembl Fungi gene record for " + gene);
    }
    if (kind === "veupathdb" && arg) {
      return extLink("VEuPathDB gene",
        "https://" + encodeURIComponent(arg) + ".org/" + encodeURIComponent(arg) +
          "/app/record/gene/" + encodeURIComponent(gene),
        "VEuPathDB gene record for " + gene);
    }
    return null;
  }

  function taxonomyLink(proteome) {
    if (!proteome) return null;
    if (proteome.taxid) {
      return extLink("NCBI Taxonomy",
        "https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=" +
          encodeURIComponent(proteome.taxid),
        "NCBI Taxonomy taxid " + proteome.taxid);
    }
    if (proteome.species) {
      return extLink("NCBI Taxonomy",
        "https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?name=" +
          encodeURIComponent(proteome.species),
        "NCBI Taxonomy search for " + proteome.species);
    }
    return null;
  }

  // ---- sequence-driven links ---------------------------------------------
  function fastaText(pid, seq) {
    return ">" + pid + "\n" + (seq.match(/.{1,60}/g) || []).join("\n") + "\n";
  }
  function copyFastaButton(pid, seq) {
    var cp = el("button", null, "Copy FASTA");
    cp.type = "button";
    cp.addEventListener("click", function () {
      var fa = fastaText(pid, seq);
      // navigator.clipboard is undefined on some file:// origins; fall back to
      // selecting a scratch textarea so the button is never a dead control.
      function done() {
        cp.textContent = "Copied";
        setTimeout(function () { cp.textContent = "Copy FASTA"; }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fa).then(done, function () { legacyCopy(fa, done); });
      } else {
        legacyCopy(fa, done);
      }
    });
    return cp;
  }
  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* leave label alone */ }
    ta.remove();
  }
  // NCBI BLAST accepts the query in the URL, but a long protein blows past the
  // ~8 KB practical URL ceiling and the request silently fails in some
  // browsers and proxies. Above the threshold, submit the same query as a POST
  // form instead -- still no external assets, still works from file://.
  var BLAST_GET_MAX_AA = 1200;
  function ncbiBlastpNode(pid, seq) {
    var base = "https://blast.ncbi.nlm.nih.gov/Blast.cgi";
    if (seq.length <= BLAST_GET_MAX_AA) {
      return extLink("BLASTP at NCBI",
        base + "?PAGE=Proteins&PROGRAM=blastp&BLAST_PROGRAMS=blastp" +
        "&DATABASE=nr&CMD=Web&QUERY=" + encodeURIComponent(seq),
        "blastp against NCBI nr");
    }
    var b = el("button", null, "BLASTP at NCBI");
    b.type = "button";
    b.title = "Sequence is " + seq.length + " aa — submitted as a POST form";
    b.addEventListener("click", function () {
      var f = document.createElement("form");
      f.method = "POST";
      f.action = base;
      f.target = "_blank";
      f.rel = "noopener noreferrer";
      var fields = { CMD: "Put", PROGRAM: "blastp", DATABASE: "nr", QUERY: fastaText(pid, seq) };
      Object.keys(fields).forEach(function (k) {
        var i = document.createElement("input");
        i.type = "hidden"; i.name = k; i.value = fields[k];
        f.appendChild(i);
      });
      document.body.appendChild(f);
      f.submit();
      f.remove();
    });
    return b;
  }

  // ---- the whole "External resources" block ------------------------------
  // One builder for all three reports so they can no longer drift apart.
  //   o.id        protein ID
  //   o.gene      gene_name ('' if none)
  //   o.sprot     Best_Swissprot ('' if none)
  //   o.pfam      Pfam_Names ('' if none)
  //   o.fsrcName  annotation source label ('' if none)
  //   o.seq       protein sequence ('' when the payload carries no sequences)
  //   o.proteome  payload proteomes[] entry for the row's source species
  function externalLinksNode(o) {
    var box = document.createDocumentFragment();
    var links = el("div", "links");
    var acc = uniprotAcc(o.sprot);
    if (acc) {
      links.appendChild(extLink("UniProt " + acc,
        "https://www.uniprot.org/uniprotkb/" + acc + "/entry"));
      links.appendChild(extLink("AlphaFold",
        "https://alphafold.ebi.ac.uk/entry/" + acc,
        "Predicted structure for " + acc));
    }
    var db = genomeDbLink(o.proteome && o.proteome.source_db, o.id);
    if (!db && o.fsrcName && o.fsrcName.indexOf("ModelOrg_") === 0) {
      // Legacy behaviour for configs with no SourceDB column: the model
      // organisms in configs/modelorgs.yaml are all FungiDB-backed.
      db = genomeDbLink("fungidb", o.id);
    }
    if (db) links.appendChild(db);
    var tax = taxonomyLink(o.proteome);
    if (tax) links.appendChild(tax);
    if (!acc && !db) {
      var term = o.gene || geneIdFromProteinId(o.id);
      links.appendChild(extLink("Search NCBI Protein",
        "https://www.ncbi.nlm.nih.gov/protein/?term=" + encodeURIComponent(term),
        "No SwissProt hit or source-database link — worth a manual check"));
    }
    if (o.seq) {
      // Copy first: every tool below it is a paste target, so the old order
      // (paste-me links above the button that fills the clipboard) was
      // backwards.
      links.appendChild(copyFastaButton(o.id, o.seq));
      links.appendChild(ncbiBlastpNode(o.id, o.seq));
      links.appendChild(extLink("UniProt BLAST",
        "https://www.uniprot.org/blast?query=" + encodeURIComponent(o.seq),
        "blastp against UniProtKB"));
    }
    box.appendChild(links);

    // A candidate with neither a Pfam domain nor a SwissProt hit is the whole
    // point of this pipeline, and it is exactly the row for which an ID-based
    // NCBI search returns nothing. Give it the remote-homology and structure
    // tools that are the real next step.
    if (o.seq && !acc && !o.pfam) {
      box.appendChild(el("p", "links-note",
        "No Pfam domain and no SwissProt hit — remote-homology and structure searches:"));
      var more = el("div", "links");
      more.appendChild(extLink("HHpred",
        "https://toolkit.tuebingen.mpg.de/tools/hhpred",
        "MPI Bioinformatics Toolkit — paste the copied FASTA"));
      more.appendChild(extLink("Foldseek",
        "https://search.foldseek.com/search",
        "Structure search — paste the copied FASTA"));
      more.appendChild(extLink("InterProScan",
        "https://www.ebi.ac.uk/interpro/search/sequence/",
        "InterProScan — paste the copied FASTA"));
      box.appendChild(more);
    }
    return box;
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
  }


  function familyLabel(fam) {
    return fam.rep + " (" + fam.size + " in " + fam.species.length +
      (fam.species.length === 1 ? " species)" : " species)");
  }

  var HAY = new Array(nRows);
  for (var h = 0; h < nRows; h++) {
    var row = ROWS[h];
    var famRep = row[F.fam] >= 0 ? FAMILIES[row[F.fam]].rep : "";
    HAY[h] = (row[F.id] + " " + row[F.gene] + " " + row[F.prod] + " " +
              row[F.pfam_n] + " " + row[F.sprot] + " " + famRep).toLowerCase();
  }

  var state = {
    search: "",
    src: "",
    fsrc: "",
    family: -1,
    noTb: false,
    sort: "priority",
    selected: -1
  };
  var view = [];

  function applyFilters() {
    var q = state.search.trim().toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    var srcIdx = state.src ? PROTEOMES.findIndex(function (p) { return p.short === state.src; }) : -1;
    var fsrcIdx = state.fsrc ? DATA.fsources.indexOf(state.fsrc) : -2;

    view = [];
    for (var i = 0; i < nRows; i++) {
      var row = ROWS[i];
      if (state.family >= 0 && row[F.fam] !== state.family) continue;
      if (srcIdx >= 0 && row[F.src] !== srcIdx) continue;
      if (state.fsrc && row[F.fsrc] !== fsrcIdx) continue;
      if (state.noTb && row[F.tb_hit]) continue;
      if (terms.length) {
        var hay = HAY[i], ok = true;
        for (var t = 0; t < terms.length; t++) {
          if (hay.indexOf(terms[t]) === -1) { ok = false; break; }
        }
        if (!ok) continue;
      }
      view.push(i);
    }
    sortView();
  }

  function sortView() {
    var s = state.sort;
    var cmpId = function (a, b) { return ROWS[a][F.id] < ROWS[b][F.id] ? -1 : ROWS[a][F.id] > ROWS[b][F.id] ? 1 : 0; };
    var cmp;
    if (s === "id") cmp = cmpId;
    else if (s === "src") cmp = function (a, b) { return (ROWS[a][F.src] - ROWS[b][F.src]) || cmpId(a, b); };
    else if (s === "frac") cmp = function (a, b) { return (ROWS[b][F.frac] - ROWS[a][F.frac]) || cmpId(a, b); };
    else if (s === "breadth") cmp = function (a, b) { return (ROWS[b][F.out_breadth] - ROWS[a][F.out_breadth]) || cmpId(a, b); };
    else if (s === "pos") cmp = function (a, b) {
      var ca = ROWS[a][F.chrom] || "", cb = ROWS[b][F.chrom] || "";
      if (ca !== cb) return ca < cb ? -1 : 1;
      var sa = ROWS[a][F.start], sb = ROWS[b][F.start];
      if (sa == null && sb == null) return cmpId(a, b);
      if (sa == null) return 1;
      if (sb == null) return -1;
      return (sa - sb) || cmpId(a, b);
    };
    // priority: the strongest loss call is a gene family retained in the fewest ingroup
    // species (cleanest loss), conserved across the most outgroup species (broadest
    // ortholog set), with no ingroup TBLASTN hit — a genomic hit means "might just be a
    // missed gene model", so it ranks below rows with none.
    else cmp = function (a, b) {
      return (ROWS[a][F.in_retained] - ROWS[b][F.in_retained]) ||
             (ROWS[b][F.out_breadth] - ROWS[a][F.out_breadth]) ||
             (ROWS[a][F.tb_hit] - ROWS[b][F.tb_hit]) || cmpId(a, b);
    };
    view.sort(cmp);
  }

  // ---- table --------------------------------------------------------------
  var TBL_COLS = [
    { label: "Protein ID", get: function (r) { return ROWS[r][F.id]; }, cls: "mono", sortKey: "id" },
    { label: "Outgroup source", get: function (r) { return ROWS[r][F.src] >= 0 ? PROTEOMES[ROWS[r][F.src]].short : ""; }, sortKey: "src" },
    { label: "Chrom", get: function (r) { return ROWS[r][F.chrom] || ""; }, cls: "mono", sortKey: "pos" },
    { label: "Start", get: function (r) { return ROWS[r][F.start] != null ? ROWS[r][F.start] : ""; }, cls: "num", sortKey: "pos" },
    { label: "Outgroup breadth", get: function (r) { return ROWS[r][F.out_breadth] + " / " + N_OUT + " species"; }, cls: "num", sortKey: "breadth" },
    { label: "Ingroup retained", get: function (r) { return ROWS[r][F.in_retained] + " / " + N_IN + " species"; }, cls: "num" },
    { label: "Outgroup presence", get: function (r) { return Math.round(ROWS[r][F.frac] * 100) + "%"; }, cls: "num", sortKey: "frac" },
    { label: "Ingroup TBLASTN", get: function (r) { return ROWS[r][F.tb_hit] ? ROWS[r][F.tb_genomes] : "none"; }, cls: "wrap-cell" },
    {
      label: "Gene family", cls: "wrap-cell",
      get: function (r) {
        var fi = ROWS[r][F.fam];
        return fi >= 0 ? FAMILIES[fi].rep + " (" + FAMILIES[fi].size + ")" : "";
      }
    },
    { label: "Gene", get: function (r) { return ROWS[r][F.gene]; } },
    { label: "Product", get: function (r) { return ROWS[r][F.prod]; }, cls: "wrap-cell" },
    { label: "Source of annotation", get: function (r) { return ROWS[r][F.fsrc] >= 0 ? DATA.fsources[ROWS[r][F.fsrc]] : ""; } },
    {
      label: "Pfam domains", cls: "wrap-cell",
      get: function (r) { return ROWS[r][F.pfam_n]; },
      render: function (td, r) { td.appendChild(pfamLinksInline(ROWS[r][F.pfam_n], ROWS[r][F.pfam_a])); }
    }
  ];

  var TBL_PAGE = 300;
  var tblShown = TBL_PAGE;
  var tblBody = document.getElementById("tbl-body");
  var tblScroll = document.getElementById("tbl-scroll");

  function renderTableHead() {
    var thead = document.getElementById("tbl-head");
    thead.textContent = "";
    var tr = document.createElement("tr");
    TBL_COLS.forEach(function (c) {
      var th = el("th", c.cls || null, c.label);
      th.scope = "col";
      if (c.sortKey) {
        th.classList.add("sortable");
        th.tabIndex = 0;
        th.setAttribute("role", "button");
        th.setAttribute("aria-label", "Sort by " + c.label);
        (function (key) {
          th.addEventListener("click", function () {
            state.sort = key;
            document.getElementById("f-sort").value = key;
            refresh(true);
          });
        })(c.sortKey);
        th.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.click(); }
        });
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    markSortHeader();
  }

  function markSortHeader() {
    var ths = document.querySelectorAll("#tbl-head th");
    TBL_COLS.forEach(function (c, i) {
      if (ths[i]) ths[i].classList.toggle("sort-active", !!c.sortKey && c.sortKey === state.sort);
    });
  }

  function renderTable(reset) {
    if (reset) { tblShown = TBL_PAGE; tblBody.textContent = ""; tblScroll.scrollTop = 0; }
    var start = tblBody.childNodes.length;
    var end = Math.min(tblShown, view.length);
    var frag = document.createDocumentFragment();
    for (var i = start; i < end; i++) {
      var ri = view[i];
      var tr = document.createElement("tr");
      tr.dataset.ri = ri;
      if (ri === state.selected) tr.className = "sel";
      TBL_COLS.forEach(function (c) {
        var td = el("td", c.cls || null, c.render ? null : (c.get(ri) || ""));
        if (c.render) c.render(td, ri);
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    }
    tblBody.appendChild(frag);
    document.getElementById("tbl-empty").classList.toggle("hidden", view.length > 0);
  }

  function markTableSelection() {
    Array.prototype.forEach.call(tblBody.childNodes, function (tr) {
      tr.className = Number(tr.dataset.ri) === state.selected ? "sel" : "";
    });
  }

  tblScroll.addEventListener("scroll", function () {
    if (tblScroll.scrollTop + tblScroll.clientHeight > tblScroll.scrollHeight - 200 && tblShown < view.length) {
      tblShown = Math.min(tblShown + TBL_PAGE, view.length);
      renderTable(false);
    }
  });
  tblBody.addEventListener("click", function (e) {
    var tr = e.target.closest("tr");
    if (tr && tr.dataset.ri !== undefined) select(Number(tr.dataset.ri));
  });

  // ---- detail panel ---------------------------------------------------------
  var detailEl = document.getElementById("detail");

  function field(label, valueNode) {
    var f = el("div", "field");
    f.appendChild(el("div", "field-label", label));
    if (typeof valueNode === "string") f.appendChild(el("div", "field-value", valueNode));
    else f.appendChild(valueNode);
    return f;
  }

  function renderDetail() {
    detailEl.textContent = "";
    var ri = state.selected;
    if (ri < 0) {
      detailEl.appendChild(el("p", "placeholder",
        "Select a protein in the table to see its annotation and database links."));
      return;
    }
    var row = ROWS[ri];
    var sp = row[F.src] >= 0 ? PROTEOMES[row[F.src]] : null;

    detailEl.appendChild(el("h3", null, row[F.id]));
    if (sp) {
      detailEl.appendChild(el("div", "species",
        sp.species + (sp.strain ? " " + sp.strain : "") + " · " + sp.short + " · outgroup"));
    }

    if (row[F.chrom]) {
      detailEl.appendChild(field("Location",
        row[F.chrom] + (row[F.start] != null ? ":" + row[F.start] : "")));
    }

    var retained = row[F.in_retained];
    var statusText = (retained === 0
        ? "Absent from every ingroup proteome"
        : "Retained in " + retained + " of " + N_IN + " ingroup species") +
      "; the gene family is present in " + row[F.out_breadth] + " of " + N_OUT +
      " outgroup species (this protein hits " + Math.round(row[F.frac] * 100) +
      "% of the outgroup).";
    var statusBox = el("div");
    statusBox.appendChild(el("div", "field-value", statusText));
    if (row[F.tb_hit]) {
      var warn = el("span", "badge warn",
        "TBLASTN hit in ingroup genome: " + row[F.tb_genomes]);
      warn.title = "The protein search found no ortholog, but a translated nucleotide " +
        "search did — this may be a missed gene model rather than a true loss.";
      statusBox.appendChild(el("div", null, warn));
    } else if (DATA.tblastn_genomes && DATA.tblastn_genomes.length) {
      statusBox.appendChild(el("div", null, el("span", "badge", "No ingroup TBLASTN hit")));
    }
    detailEl.appendChild(field("Status", statusBox));

    if (row[F.fam] >= 0) {
      var fam = FAMILIES[row[F.fam]];
      var famBox = el("div");
      famBox.appendChild(el("div", "field-value",
        fam.size + " members across " + fam.species.length + " species (" + fam.species.join(", ") + ")"));
      var famLinks = el("div", "links");
      var famBtn = el("button", null, "Show family members (" + fam.size + ")");
      famBtn.type = "button";
      famBtn.addEventListener("click", function () { setFamilyFilter(row[F.fam]); });
      famLinks.appendChild(famBtn);
      famBox.appendChild(famLinks);
      detailEl.appendChild(field("Gene family — independently recovered in multiple outgroup species", famBox));
    }

    if (row[F.gene]) detailEl.appendChild(field("Gene name (outgroup)", row[F.gene]));
    if (row[F.prod]) detailEl.appendChild(field("Product", row[F.prod]));
    if (row[F.fsrc] >= 0) detailEl.appendChild(field("Annotation source", DATA.fsources[row[F.fsrc]]));
    if (row[F.sprot]) detailEl.appendChild(field("Best SwissProt hit", uniprotLinkNode(row[F.sprot])));

    if (row[F.pfam_n]) {
      var pfamCount = row[F.pfam_n].split(",").length;
      detailEl.appendChild(field("Pfam domains (" + pfamCount + ")",
        pfamChipsNode(row[F.pfam_n], row[F.pfam_a], row[F.pfam_e])));
    }

    // External links come from the one shared builder in lib/report_common.py,
    // resolved against the *outgroup* protein since that is where the gene
    // actually is (e.g. "this looks like S. cerevisiae's ERG3").
    detailEl.appendChild(field("External resources (outgroup protein)", externalLinksNode({
      id: row[F.id],
      gene: row[F.gene],
      sprot: row[F.sprot],
      pfam: row[F.pfam_n],
      fsrcName: row[F.fsrc] >= 0 ? DATA.fsources[row[F.fsrc]] : "",
      seq: "",
      proteome: row[F.src] >= 0 ? PROTEOMES[row[F.src]] : null
    })));
  }

  function select(ri) {
    state.selected = ri;
    renderDetail();
    markTableSelection();
  }

  // ---- downloads ------------------------------------------------------------
  document.getElementById("dl-tsv").addEventListener("click", function () {
    var lines = [TBL_COLS.map(function (c) { return c.label; }).join("\t")];
    view.forEach(function (ri) {
      lines.push(TBL_COLS.map(function (c) { return String(c.get(ri) || "").replace(/[\t\n\r]/g, " "); }).join("\t"));
    });
    download(DATA.project + ".losses.tsv", lines.join("\n") + "\n", "text/tab-separated-values");
  });

  // ---- summary ----------------------------------------------------------
  function renderSummary() {
    var flagged = 0;
    for (var i = 0; i < nRows; i++) { if (ROWS[i][F.tb_hit]) flagged++; }
    var nOut = PROTEOMES.filter(function (p) { return p.group === "OUT"; }).length;

    var absenceText = (DATA.loss_ingroup_max_frac > 0)
      ? "retained in at most " + Math.round(DATA.loss_ingroup_max_frac * 100) + "% of the ingroup"
      : "absent from every ingroup proteome";
    document.getElementById("summary-note").textContent =
      "Gene families conserved in ≥" + Math.round((DATA.outgroup_min_frac || 0) * 100) +
      "% of the outgroup but " + absenceText + " — candidate lineage-specific gene losses, " +
      "prioritized by ingroup retention (cleanest loss first), outgroup family breadth, and " +
      "absence of ingroup genomic (TBLASTN) evidence.";
    document.getElementById("t-total").textContent = nRows.toLocaleString();
    document.getElementById("t-out").textContent = nOut + (nOut === 1 ? " species" : " species");
    document.getElementById("t-fam").textContent = FAMILIES.length.toLocaleString();
    document.getElementById("t-flagged").textContent =
      nRows ? flagged.toLocaleString() + " (" + Math.round((flagged / nRows) * 100) + "%)" : "—";
  }

  // ---- wiring -------------------------------------------------------------
  function refresh(resetScroll) {
    applyFilters();
    markSortHeader();
    if (state.selected >= 0 && view.indexOf(state.selected) === -1) {
      state.selected = -1;
      renderDetail();
    }
    document.getElementById("count").textContent =
      "Showing " + view.length.toLocaleString() + " of " + nRows.toLocaleString() + " proteins";
    renderTable(true);
  }

  function populateSelects() {
    var src = document.getElementById("f-src");
    src.appendChild(new Option("All outgroup proteomes", ""));
    PROTEOMES.filter(function (p) { return p.group === "OUT"; }).forEach(function (p) {
      src.appendChild(new Option(p.short + " — " + p.species, p.short));
    });
    var fs = document.getElementById("f-fsrc");
    fs.appendChild(new Option("Any annotation source", ""));
    DATA.fsources.slice().sort().forEach(function (f) { fs.appendChild(new Option(f, f)); });

    var fam = document.getElementById("f-family");
    fam.appendChild(new Option(
      FAMILIES.length ? "All families (" + FAMILIES.length + ")" : "No multi-species families", ""
    ));
    FAMILIES.forEach(function (f, i) { fam.appendChild(new Option(familyLabel(f), String(i))); });
  }

  function setFamilyFilter(idx) {
    state.family = idx;
    document.getElementById("f-family").value = idx >= 0 ? String(idx) : "";
    refresh(true);
  }

  var searchTimer = null;
  document.getElementById("f-search").addEventListener("input", function (e) {
    var v = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { state.search = v; refresh(true); }, 140);
  });
  document.getElementById("f-src").addEventListener("change", function (e) { state.src = e.target.value; refresh(true); });
  document.getElementById("f-fsrc").addEventListener("change", function (e) { state.fsrc = e.target.value; refresh(true); });
  document.getElementById("f-family").addEventListener("change", function (e) {
    state.family = e.target.value === "" ? -1 : Number(e.target.value);
    refresh(true);
  });
  document.getElementById("f-notb").addEventListener("change", function (e) { state.noTb = e.target.checked; refresh(true); });
  document.getElementById("f-sort").addEventListener("change", function (e) { state.sort = e.target.value; refresh(true); });
  document.getElementById("f-reset").addEventListener("click", function () {
    state.search = ""; state.src = ""; state.fsrc = ""; state.family = -1;
    state.noTb = false; state.sort = "priority";
    document.getElementById("f-search").value = "";
    document.getElementById("f-src").value = "";
    document.getElementById("f-fsrc").value = "";
    document.getElementById("f-family").value = "";
    document.getElementById("f-notb").checked = false;
    document.getElementById("f-sort").value = "priority";
    refresh(true);
  });


  var skinSel = document.getElementById("skin");
  function notifySkinChange() {
    if (typeof window.onSkinChange === "function") window.onSkinChange();
  }
  function storeSkin(v) {
    try {
      if (v) localStorage.setItem("novinvenio.skin", v);
      else localStorage.removeItem("novinvenio.skin");
    } catch (e) { /* storage unavailable -- selection still applies for this page */ }
  }
  skinSel.value = document.documentElement.getAttribute("data-skin") || "";
  skinSel.addEventListener("change", function () {
    var v = skinSel.value;
    if (v) document.documentElement.setAttribute("data-skin", v);
    else document.documentElement.removeAttribute("data-skin");
    storeSkin(v);
    notifySkinChange();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", notifySkinChange);


  // ---- init ---------------------------------------------------------------
  document.getElementById("title").textContent = DATA.project + " — candidate gene losses";
  var inNames = PROTEOMES.filter(function (p) { return p.group === "IN"; })
    .map(function (p) { return p.species; }).join(", ");
  var outNames = PROTEOMES.filter(function (p) { return p.group === "OUT"; })
    .map(function (p) { return p.species; }).join(", ");
  document.getElementById("subtitle").textContent =
    "Ingroup: " + inNames + "  ·  Outgroup: " + outNames;
  document.title = DATA.project + " — NovInvenio candidate losses";

  populateSelects();
  renderSummary();
  renderTableHead();
  refresh(true);
  renderDetail();
})();
</script>
</body>
</html>
