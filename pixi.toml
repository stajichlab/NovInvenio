[workspace]
authors = ["Jason Stajich <jason.stajich@ucr.edu>"]
channels = ["conda-forge", "bioconda"]
name = "NovInvenio"
platforms = ["linux-64"]
version = "0.5.0"

[tasks]
test = "pytest tests/ -v"
lint = "ruff check bin/ lib/ tests/"

[dependencies]
hmmer = ">=3.4,<4"
diamond = ">=2.2.0,<3"
blast = ">=2.17.0,<3"
python = "3.12.*"
minimap2 = ">=2.31,<3"
mmseqs2 = ">=18.8cc5c,<19"
samtools = ">=1.23.1,<2"
pandas = ">=2.2,<3"
biopython = ">=1.84,<2"
pytest = ">=8.0,<9"
