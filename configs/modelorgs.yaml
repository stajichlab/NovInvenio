# Model organism annotation configuration for NovInvenio.
#
# Each entry maps proteins from one ingroup species (identified by its "Short"
# ID in the analysis CSV) to gene names and product descriptions from a
# reference database.
#
# Required fields for every entry:
#   short          - must match the Short column in the analysis config CSV
#   gene_names_csv - path to a CSV/TSV with gene IDs, names, and descriptions
#
# id_transform controls how a protein ID from the presence matrix is converted
# to a gene key for lookup in gene_names_csv:
#
#   direct        - protein_id is used as-is (no transformation)
#   strip         - regex strip_pattern is removed from protein_id
#                   e.g. "Afu1g00220-T-p1"  →  "Afu1g00220"
#   diamond_fasta - multi-step via diamond hits + FASTA header parsing:
#                   local_protein_id → (diamond_hits TSV) → ref_protein_id
#                   → (protein_fasta headers, field fasta_gene_field) → gene_id
#                   e.g. "FC69C3D3_000001-T1" → "NCU10129-t26_1-p1" → "NCU10129"
#
# Optional column overrides (FungiDB CSV export format is the default):
#   gene_id_col:   "Gene ID"               # column with the gene identifier
#   gene_name_col: "Gene Name or Symbol"   # column with the gene symbol/name
#   product_col:   "Product Description"   # column with the functional description
#   csv_delimiter: ","                     # use "\t" for tab-separated files

model_organisms:

  # Neurospora crassa OR74A
  # Local BFD project protein IDs must be mapped to FungiDB NCU IDs via a diamond search.
  - short: Ncra
    gene_names_csv: db/modelorgs/Neurospora_crassa_gene_names_FungiDB.csv
    id_transform: strip
    strip_pattern: "-t\\d+_1-p\\d$"

  # Aspergillus fumigatus Af293
  # FungiDB protein IDs end in "-T-p<N>"; stripping that suffix gives the gene ID.
  - short: Afum
    gene_names_csv: db/modelorgs/Aspergillus_fumigatus_gene_names_FungiDB.csv
    protein_fasta: db/modelorgs/FungiDB-68_AfumigatusAf293_AnnotatedProteins.fasta
    id_transform: strip
    strip_pattern: "-T-p\\d+$"

  - short: Scer
    gene_names_csv: db/modelorgs/Scerevisiae_gene_names_FungiDB.csv
    protein_fasta: db/modelorgs/FungiDB-68_ScerevisiaeS288C_AnnotatedProteins.fasta
    id_transform: strip
    strip_pattern: "-t\\d+_1-p\\d+$"

  - short: Spom
    gene_names_csv: db/modelorgs/Spombe_gene_names_FungiDB.csv
    protein_fasta: db/modelorgs/FungiDB-68_Spombe972h_AnnotatedProteins.fasta
    id_transform: strip
    strip_pattern: "-p\\d+$"

# ── Adding a new organism ─────────────────────────────────────────────────────
#
# 1. Obtain the gene names CSV for your organism from FungiDB (or another DB).
#    The file needs at minimum: gene identifier column, gene name, and description.
#    Configure the column names with gene_id_col/gene_name_col/product_col if they
#    differ from the FungiDB defaults above.
#
# 2. Choose an id_transform that maps your proteome's protein IDs to the gene IDs
#    used in the CSV:
#      - If protein IDs already match gene IDs: use id_transform: direct
#      - If protein IDs have a predictable suffix to strip: use id_transform: strip
#      - If you need a diamond search to cross-reference IDs: use id_transform: diamond_fasta
#        Run:  diamond blastp --query your_proteome.fa --db reference_proteome.dmnd
#              --outfmt 6 --max-target-seqs 1 --out mapping.diamond.tsv
#
# 3. Add the entry here, set --modelorgs_config configs/modelorgs.yaml in your
#    nextflow run command (or set params.modelorgs_config in nextflow.config).
