name: Tag Release on Version Bump

# Watches pixi.toml's [workspace] version on every push to main. When it
# changes (and no `vX.Y.Z` tag for that version exists yet), creates and
# pushes the tag plus a GitHub Release. Pushing the tag is what triggers
# docker-build.yml to build, push, and cosign-sign the versioned image —
# so bumping pixi.toml's version and merging to main is the entire release
# process; no manual `git tag` / `docker push` step needed.

on:
  push:
    branches: [main]
    paths:
      - 'pixi.toml'
  workflow_dispatch: {}  # manual re-run, e.g. to release the version already in pixi.toml

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from pixi.toml
        id: version
        run: |
          version=$(grep -m1 -E '^\s*version\s*=' pixi.toml | sed -E 's/^\s*version\s*=\s*"([^"]+)"\s*$/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from pixi.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
