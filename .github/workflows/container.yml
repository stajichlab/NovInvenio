name: Build and Sign Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., 0.5.0)'
        required: true
        default: '0.5.0'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novinvenio
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with OIDC
        env:
          COSIGN_FUNCTIONALITY: 1
        run: |
          # Sign the image using the digest (more secure than tag)
          IMAGE_DIGEST=$(docker inspect ghcr.io/${{ github.repository_owner }}/novinvenio:${{ github.ref_name }} --format='{{index .RepoDigests 0}}' | cut -d@ -f2)
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/novinvenio@${IMAGE_DIGEST}

      - name: Verify signature
        run: |
          IMAGE_DIGEST=$(docker inspect ghcr.io/${{ github.repository_owner }}/novinvenio:${{ github.ref_name }} --format='{{index .RepoDigests 0}}' | cut -d@ -f2)
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/container.yml@refs/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ghcr.io/${{ github.repository_owner }}/novinvenio@${IMAGE_DIGEST}
          echo "✓ Image signed and verified: ghcr.io/${{ github.repository_owner }}/novinvenio@${IMAGE_DIGEST}"
